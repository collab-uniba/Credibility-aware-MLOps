[project]
name = "cmlops"
version = "0.1.0"
description = "MLOps framework that embeds verification activities into ML experimentation and tracks the resulting credibility evidence alongside data, runs, and models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "dvc>=3.67.1",
    "gitpython>=3.1",
    "joblib>=1.3",
    "mlflow>=2.10.0",
    "nbformat>=5.10.4",
    "pandas>=2.0",
    "pandera>=0.20",
    "prefect>=3.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "scikit-learn>=1.8.0",
    "typer>=0.12.0",
    "vv4ml>=1.0.8",
    "xgboost>=3.1.3",
]

[project.scripts]
cmlops = "cmlops.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["cmlops*"]
